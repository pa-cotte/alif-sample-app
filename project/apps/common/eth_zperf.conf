# Shared Ethernet + zperf benchmark Kconfig fragment.
#
# Merged into whichever core's app is built with APP_ETHERNET=ON (see each
# app's CMakeLists.txt) alongside the shared eth.overlay. Keeping it out of the
# per-app prj.conf lets HE and HP share one identical networking config and
# guarantees only the selected core brings up the (single) Alif MAC.

#### Ethernet + networking stack ####
# Enables the Alif native MAC driver. It auto-registers its net_if at boot
# (ETH_NET_DEVICE_DT_INST_DEFINE), so Ethernet starts automatically.
CONFIG_ETH_ALIF=y
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y

# IPv4 only for a direct point-to-point link to the PC
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y

#### Static IP (direct connection to PC) ####
# Board address = 192.168.0.2 ; set the PC to e.g. 192.168.0.1/24.
# NET_CONFIG_AUTO_INIT applies this at boot, no app code needed.
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_AUTO_INIT=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.0.2"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.0.1"
# Direct cable: no DHCP, no IPv4 link-local autoconf
CONFIG_NET_DHCPV4=n
CONFIG_NET_IPV4_AUTO=n

#### Alif MAC driver RX tuning (benchmark) ####
# Per-packet RX busy-wait (ARP-timing workaround) costs CPU in the RX drain
# path; 0 disables it. Larger RX DMA ring absorbs bursts -> higher sustained RX.
CONFIG_ETH_ALIF_RX_DELAY_US=0
# Zero-copy RX needs 2 x RX_DESC_COUNT buffers in the 64 KB ETH_DMA region,
# so keep the ring at 16 here (16 armed + 16 spares = 32 x 1536 B).
CONFIG_ETH_ALIF_RX_DESC_COUNT=16
CONFIG_ETH_ALIF_ZEROCOPY_RX=y
# NOTE: zero-copy TX (CONFIG_ETH_ALIF_ZEROCOPY_TX) was tried here and REGRESSED
# UDP TX (held net_pkt refs starve the TX pool -> stalls). Left off; the copy
# TX path is the supported one. TX ceiling stays ~67 Mb/s (board TX-bound).

#### zperf throughput tool (driven from the shell) ####
CONFIG_SHELL=y
CONFIG_NET_SHELL=y
CONFIG_NET_ZPERF=y

# zperf's "download" servers run on the shared socket-service thread. At boot
# that thread sums the pollfds of ALL statically-defined services and bails out
# (-> every register returns -EIO -> "Failed to start server!") if the total + 1
# exceeds ZVFS_POLL_MAX. zperf unconditionally defines BOTH a TCP and a UDP
# service, each SOCK_ID_MAX = NET_ZPERF_MAX_SESSIONS(4) + 2 = 6, so count = 12
# and we need ZVFS_POLL_MAX >= 13. 16 leaves headroom.
# ZVFS_OPEN_MAX must cover concurrently-open fds: listen sockets + the service
# eventfd + accepted sessions.
CONFIG_ZVFS_POLL_MAX=16
CONFIG_ZVFS_OPEN_MAX=12

#### Buffers / stacks sized for throughput measurement ####
# RX is sized larger than TX: at ~100 Mb/s line rate the board is the receiver
# for "download" tests and starves on net_pkt_rx_alloc_with_buffer() with the
# default counts (TCP download then stalls for lack of ACKs). Bump RX headroom.
CONFIG_NET_PKT_RX_COUNT=48
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=96
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_MAX_CONTEXTS=8
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
