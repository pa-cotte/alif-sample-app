#### Serial / shell ####
CONFIG_SERIAL=y
CONFIG_GPIO=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_SHELL=y

#### USB device stack (next) + CDC-ECM class ####
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ECM_CLASS=y
CONFIG_SAMPLE_USBD_PID=0x0009
CONFIG_SAMPLE_USBD_PRODUCT="Alif E7 CDC-ECM sample"
# net_if_carrier_on() runs on the USB device thread, which overflows the default 1024 bytes.
CONFIG_USBD_THREAD_STACK_SIZE=2048
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y

#### Networking: one static IPv4 address on the CDC-ECM interface ####
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
# The CDC-ECM class depends on it without selecting it.
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_UDP=y
# A dedicated TX thread is mandatory: with 0, the carrier-on triggered by SET_INTERFACE sends from
# the USB device thread, which then waits forever on a completion only that thread can deliver.
CONFIG_NET_TC_TX_COUNT=1
# The address has to exist before enumeration; the stack would otherwise wait for the application.
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_AUTO_INIT=y
CONFIG_NET_CONFIG_INIT_TIMEOUT=0
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.1"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
# Room for full-size (1514-byte) frames in both directions.
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_NET_SHELL=y

CONFIG_HEAP_MEM_POOL_SIZE=8192
