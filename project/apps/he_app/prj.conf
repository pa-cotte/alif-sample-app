#### Serial config ####
CONFIG_SERIAL=y
CONFIG_GPIO=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y

#### BLE HCI (H4 UART transport over UART3) ####
CONFIG_BT=y
CONFIG_BT_HCI=y
CONFIG_BT_H4=y

#### BLE Peripheral (connectable advertising) ####
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Alif2FY"

#### IP networking (required by WiFi offload + credentials) ####
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y

#### WiFi (AIROC CYW55513 offloaded via SDHC) ####
CONFIG_WIFI=y
CONFIG_WIFI_OFFLOAD=y
CONFIG_NET_OFFLOAD=y
CONFIG_SDIO_STACK=y
CONFIG_SD_UHS_PROTOCOL=y
CONFIG_SDIO_USE_INTERNAL_BUFFER=y
