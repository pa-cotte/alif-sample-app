# MCUboot image-management stack.
# Sysbuild computes CONFIG_MCUBOOT_UPDATE_FOOTER_SIZE from the MCUboot
# build and injects it via .config.sysbuild.  That symbol lives under
# if MCUBOOT_IMG_MANAGER → if IMG_MANAGER, so all three layers must be
# reachable or Kconfig raises "assigned X but got ''" and aborts.
#
# FLASH=y  → auto-selects MRAM_FLASH_ALIF (default y, DT node present)
#          → selects FLASH_HAS_DRIVER_ENABLED
# FLASH_MAP=y depends on FLASH_HAS_DRIVER_ENABLED  ✓
# STREAM_FLASH=y  has no deps
# IMG_MANAGER=y depends on STREAM_FLASH  ✓
#   default choice MCUBOOT_IMG_MANAGER depends on FLASH_MAP  ✓
#     → MCUBOOT_UPDATE_FOOTER_SIZE becomes writable
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
