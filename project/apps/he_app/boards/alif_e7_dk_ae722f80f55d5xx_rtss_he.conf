# alif_e7_dk DTS declares a gpio-keys node (button0) without `zephyr,code`
# property; disable INPUT_GPIO_KEYS driver to avoid its BUILD_ASSERT.
CONFIG_INPUT_GPIO_KEYS=n

# AIROC chip / module selection for the Murata 2FY (CYW55513, WiFi 6).
# Set here because choice members cannot be driven from Kconfig directives.
CONFIG_CYW55500=y
CONFIG_CYW955513SDM2WLIPA_SM=y
CONFIG_BT_CYW55513_MURATA_2FY=y

# AIROC WiFi driver and abstraction-rtos (cyabs_rtos_zephyr) use k_malloc to
# allocate WHD thread stacks and buffers; k_malloc is only available when
# CONFIG_HEAP_MEM_POOL_SIZE > 0.
CONFIG_HEAP_MEM_POOL_SIZE=32768

# AIROC WiFi (airoc_init) depends on SDHC (sdhc_dwc_init).  Default
# WIFI_INIT_PRIORITY=80 < SDHC_INIT_PRIORITY=85, so AIROC would be
# initialised before SDHC.  Raise it above 85 to restore correct order.
CONFIG_WIFI_INIT_PRIORITY=90

# WiFi/BLE stack requirements: AIROC SDHC init and WHD internals consume
# significantly more than Zephyr's 1024-byte defaults.  Values match the
# reference project (armorique/apps/shared/Kconfig.asterix).
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
