#### Serial config ####
CONFIG_SERIAL=y
CONFIG_GPIO=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y

#### SPI3 + MA780 angle sensor (repro for Alif support) ####
CONFIG_SPI=y
CONFIG_SPI_DW=y
CONFIG_SENSOR=y
# MA780 driver (auto-enabled by the devicetree node, kept explicit here)
CONFIG_MA780=y
# Make the driver's "write not acknowledged after N attempts" errors visible
CONFIG_SENSOR_LOG_LEVEL_DBG=y

