#### Serial config ####
CONFIG_SERIAL=y
CONFIG_GPIO=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y

#### SPI through DMA ####
CONFIG_SPI=y
CONFIG_SPI_DW_USE_DMA=y
CONFIG_DMA=y
# The DMA event router logs every channel configuration at INFO level, which drops the test results.
CONFIG_DMA_ALIF_EVENT_ROUTER_LOG_LEVEL_WRN=y
