description: MA780 Low-Power Angle Sensor with Integrated Wake-Up Angle Detection

compatible: "mps,ma780"

include: [sensor-device.yaml, spi-device.yaml]

properties:
  int-gpios:
    required: false
    type: phandle-array
    description: |
      The INT signal defaults to active high as produced by the
      sensor.  The property value should ensure the flags properly
      describe the signal that is presented to the driver.

  wakeup-mode:
    required: false
    type: boolean
    description: |
      This mode is intended for extremely low power consumption,
      checking for motion only about six times a second.

  autosleep:
    required: false
    type: boolean
    description: |
      Enter Wake-Up mode when inactivity is detected,
      reenter Measurement mode when activity is detected.
      Only applies for Linked and Loop mode, ignored otherwise.
